name: GeoKlik gallery camera patch

on:
  push:
    branches: [feature/gallery-photo-actions]

permissions:
  contents: write

jobs:
  patch-gallery-camera:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/gallery-photo-actions
          fetch-depth: 0

      - name: Apply and verify patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java')
          s = p.read_text(encoding='utf-8')
          dup = '        if (imageRepo.hasNearbyPhoto(siteId, captureLoc.getLatitude(), captureLoc.getLongitude(), DUPLICATE_RADIUS_METERS)) {'
          dup2 = '        final String documentationType = cameraPrefs.getDocumentationType();\n        final boolean requireDuplicateCheck = CameraPrefs.DOC_INFRA.equals(documentationType);\n\n        if (requireDuplicateCheck && imageRepo.hasNearbyPhoto(siteId, captureLoc.getLatitude(), captureLoc.getLongitude(), DUPLICATE_RADIUS_METERS)) {'
          if dup not in s: raise SystemExit('duplicate target not found')
          s = s.replace(dup, dup2, 1)
          reset = '    private void resetCaptureLifecycle() {\n        isCapturing = false;\n        updateCaptureAvailability();\n    }'
          reset2 = '    private void resetCaptureLifecycle() {\n        isCapturing = false;\n        setCaptureState(CameraStateManager.State.WAITING_FOR_GPS);\n        updateCaptureAvailability();\n    }'
          if reset not in s: raise SystemExit('reset target not found')
          s = s.replace(reset, reset2, 1)
          bind = '                provider.unbindAll();\n                androidx.camera.core.Camera boundCamera = provider.bindToLifecycle(\n                        this,\n                        CameraSelector.DEFAULT_BACK_CAMERA,\n                        previewUseCase,\n                        imageCapture);'
          bind2 = '                androidx.camera.core.ViewPort viewPort = previewView.getViewPort();\n                androidx.camera.core.UseCaseGroup.Builder useCaseGroupBuilder = new androidx.camera.core.UseCaseGroup.Builder()\n                        .addUseCase(previewUseCase)\n                        .addUseCase(imageCapture);\n                if (viewPort != null) useCaseGroupBuilder.setViewPort(viewPort);\n                androidx.camera.core.UseCaseGroup useCaseGroup = useCaseGroupBuilder.build();\n\n                provider.unbindAll();\n                androidx.camera.core.Camera boundCamera = provider.bindToLifecycle(\n                        this,\n                        CameraSelector.DEFAULT_BACK_CAMERA,\n                        useCaseGroup);'
          if bind not in s: raise SystemExit('binding target not found')
          s = s.replace(bind, bind2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'requireDuplicateCheck = CameraPrefs.DOC_INFRA' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java
          grep -q 'previewView.getViewPort()' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java

      - name: Commit source and clean patch workflows
        run: |
          rm -f .github/workflows/apply-gallery-camera-fixes.yml
          rm -f .github/workflows/gallery-camera-fix-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix camera framing duplicate rules and discard reset'
          git push origin HEAD:feature/gallery-photo-actions
