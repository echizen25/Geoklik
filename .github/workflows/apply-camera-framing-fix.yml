name: Apply camera framing fix

on:
  push:
    branches:
      - fix/change-site-project-dropdown
    paths:
      - .github/workflows/apply-camera-framing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/change-site-project-dropdown
          fetch-depth: 0

      - name: Patch GeoCameraActivity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java')
          text = path.read_text(encoding='utf-8')
          old_dup = '        if (imageRepo.hasNearbyPhoto(siteId, captureLoc.getLatitude(), captureLoc.getLongitude(), DUPLICATE_RADIUS_METERS)) {'
          new_dup = '        // Only fixed Infrastructure captures need the 5-meter duplicate warning.\n        // Activity and Personal captures may legitimately contain many photos from one spot.\n        final String documentationType = cameraPrefs.getDocumentationType();\n        final boolean requireDuplicateCheck = CameraPrefs.DOC_INFRA.equals(documentationType);\n\n        if (requireDuplicateCheck && imageRepo.hasNearbyPhoto(siteId, captureLoc.getLatitude(), captureLoc.getLongitude(), DUPLICATE_RADIUS_METERS)) {'
          if old_dup not in text:
              raise SystemExit('Duplicate-check target not found; refusing unsafe patch')
          text = text.replace(old_dup, new_dup, 1)
          marker = '                provider.unbindAll();\n                androidx.camera.core.Camera boundCamera = provider.bindToLifecycle(\n                        this,\n                        CameraSelector.DEFAULT_BACK_CAMERA,\n                        previewUseCase,\n                        imageCapture);'
          replacement = '                // Use the PreviewView viewport for both Preview and ImageCapture so the\n                // saved JPEG matches the visible fillCenter framing and CameraControl zoom.\n                androidx.camera.core.ViewPort viewPort = previewView.getViewPort();\n                androidx.camera.core.UseCaseGroup.Builder useCaseGroupBuilder =\n                        new androidx.camera.core.UseCaseGroup.Builder()\n                                .addUseCase(previewUseCase)\n                                .addUseCase(imageCapture);\n                if (viewPort != null) {\n                    useCaseGroupBuilder.setViewPort(viewPort);\n                }\n                androidx.camera.core.UseCaseGroup useCaseGroup = useCaseGroupBuilder.build();\n\n                provider.unbindAll();\n                androidx.camera.core.Camera boundCamera = provider.bindToLifecycle(\n                        this,\n                        CameraSelector.DEFAULT_BACK_CAMERA,\n                        useCaseGroup);'
          if marker not in text:
              raise SystemExit('Camera binding target not found; refusing unsafe patch')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted changes
        shell: bash
        run: |
          grep -q 'requireDuplicateCheck = CameraPrefs.DOC_INFRA.equals(documentationType)' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java
          grep -q 'previewView.getViewPort()' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java
          grep -q 'useCaseGroupBuilder.setViewPort(viewPort)' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java

      - name: Compile app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew compileDebugJavaWithJavac --no-daemon

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-camera-framing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java .github/workflows/apply-camera-framing-fix.yml
          git commit -m "Fix camera framing and duplicate capture rules"
          git push origin HEAD:fix/change-site-project-dropdown
