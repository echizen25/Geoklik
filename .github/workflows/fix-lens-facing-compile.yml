name: Fix lens facing compile
on:
  push:
    branches: [feature/gallery-photo-actions]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gallery-photo-actions
          fetch-depth: 0
      - name: Fix primitive lens facing check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java')
          s=p.read_text()
          old='''                if (info.getLensFacing() == null ||\n                        info.getLensFacing() != CameraSelector.LENS_FACING_BACK) continue;'''
          new='''                if (info.getLensFacing() != CameraSelector.LENS_FACING_BACK) continue;'''
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep -q 'if (info.getLensFacing() != CameraSelector.LENS_FACING_BACK) continue;' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java
      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/fix-lens-facing-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix CameraInfo lens facing compile check'
          git push origin HEAD:feature/gallery-photo-actions
