name: GeoKlik ultrawide pinch switch
on:
  push:
    branches: [feature/gallery-photo-actions]
permissions:
  contents: write
jobs:
  patch-ultrawide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gallery-photo-actions
          fetch-depth: 0
      - name: Patch camera lens switching
        run: |
          python - <<'PY'
          from pathlib import Path

          # ----- CameraGestureController -----
          p = Path('app/src/main/java/ph/gov/geocamera/presentation/geocamera/CameraGestureController.java')
          s = p.read_text(encoding='utf-8')

          s = s.replace('''public final class CameraGestureController {\n\n    private static final long FOCUS_FADE_DELAY_MS = 650L;''', '''public final class CameraGestureController {\n\n    public interface LensSwitchHandler {\n        void requestWideLens();\n        void requestMainLens();\n    }\n\n    private static final long FOCUS_FADE_DELAY_MS = 650L;''', 1)

          s = s.replace('''    private Camera camera;\n    private boolean scaling;''', '''    private Camera camera;\n    private boolean scaling;\n    private final LensSwitchHandler lensSwitchHandler;\n    private float effectiveBaseRatio = NORMAL_ZOOM_RATIO;\n    private boolean wideLensAvailable = false;\n    private boolean usingWideLens = false;''', 1)

          s = s.replace('''        this.activity = activity;\n        this.previewView = previewView;''', '''        this.activity = activity;\n        this.previewView = previewView;\n        this.lensSwitchHandler = activity instanceof LensSwitchHandler\n                ? (LensSwitchHandler) activity : null;''', 1)

          old_attach = '''    public void attachCamera(@NonNull Camera camera) {\n        this.camera = camera;\n\n        CameraFlashController.attach(activity, camera);'''
          new_attach = '''    public void attachCamera(@NonNull Camera camera) {\n        attachCamera(camera, NORMAL_ZOOM_RATIO, false, false);\n    }\n\n    public void attachCamera(@NonNull Camera camera, float effectiveBaseRatio,\n                             boolean wideLensAvailable, boolean usingWideLens) {\n        this.camera = camera;\n        this.effectiveBaseRatio = Math.max(0.1f, effectiveBaseRatio);\n        this.wideLensAvailable = wideLensAvailable;\n        this.usingWideLens = usingWideLens;\n\n        CameraFlashController.attach(activity, camera);'''
          if old_attach not in s: raise SystemExit('attach target not found')
          s = s.replace(old_attach, new_attach, 1)

          old_zoom = '''        float target = state.getZoomRatio() * scaleFactor;\n        target = Math.max(state.getMinZoomRatio(), Math.min(state.getMaxZoomRatio(), target));\n        currentCamera.getCameraControl().setZoomRatio(target);'''
          new_zoom = '''        float currentEffective = state.getZoomRatio() * effectiveBaseRatio;\n        float targetEffective = currentEffective * scaleFactor;\n\n        // Crossing below 1x from the main camera switches to the real ultrawide lens.\n        if (!usingWideLens && wideLensAvailable && targetEffective < NORMAL_ZOOM_RATIO - 0.02f) {\n            if (lensSwitchHandler != null) lensSwitchHandler.requestWideLens();\n            return;\n        }\n\n        // Crossing back to 1x while on ultrawide restores the main rear lens.\n        if (usingWideLens && targetEffective >= NORMAL_ZOOM_RATIO - 0.02f) {\n            if (lensSwitchHandler != null) lensSwitchHandler.requestMainLens();\n            return;\n        }\n\n        float targetPhysical = targetEffective / effectiveBaseRatio;\n        targetPhysical = Math.max(state.getMinZoomRatio(),\n                Math.min(state.getMaxZoomRatio(), targetPhysical));\n        currentCamera.getCameraControl().setZoomRatio(targetPhysical);'''
          if old_zoom not in s: raise SystemExit('zoom target not found')
          s = s.replace(old_zoom, new_zoom, 1)

          old_toggle = '''        float minZoom = state.getMinZoomRatio();\n        float current = state.getZoomRatio();\n\n        if (minZoom >= NORMAL_ZOOM_RATIO - 0.01f) {\n            currentCamera.getCameraControl().setZoomRatio(NORMAL_ZOOM_RATIO);\n            return;\n        }\n\n        float target = current < NORMAL_ZOOM_RATIO - 0.05f\n                ? NORMAL_ZOOM_RATIO\n                : minZoom;\n        currentCamera.getCameraControl().setZoomRatio(target);'''
          new_toggle = '''        if (usingWideLens) {\n            if (lensSwitchHandler != null) lensSwitchHandler.requestMainLens();\n        } else if (wideLensAvailable) {\n            if (lensSwitchHandler != null) lensSwitchHandler.requestWideLens();\n        } else {\n            currentCamera.getCameraControl().setZoomRatio(NORMAL_ZOOM_RATIO);\n        }'''
          if old_toggle not in s: raise SystemExit('toggle target not found')
          s = s.replace(old_toggle, new_toggle, 1)

          old_render = '''        zoomIndicator.setText(formatZoom(state.getZoomRatio()));\n        zoomIndicator.setVisibility(View.VISIBLE);\n\n        boolean hasWide = state.getMinZoomRatio() < NORMAL_ZOOM_RATIO - 0.01f;\n        zoomIndicator.setClickable(hasWide);\n        zoomIndicator.setFocusable(hasWide);\n        zoomIndicator.setAlpha(hasWide ? 1f : 0.88f);\n        zoomIndicator.setContentDescription(hasWide\n                ? "Zoom. Tap to switch between wide and 1x."\n                : "Zoom. Pinch to zoom.");'''
          new_render = '''        float effectiveRatio = state.getZoomRatio() * effectiveBaseRatio;\n        zoomIndicator.setText(formatZoom(effectiveRatio));\n        zoomIndicator.setVisibility(View.VISIBLE);\n\n        zoomIndicator.setClickable(wideLensAvailable);\n        zoomIndicator.setFocusable(wideLensAvailable);\n        zoomIndicator.setAlpha(wideLensAvailable ? 1f : 0.88f);\n        zoomIndicator.setContentDescription(wideLensAvailable\n                ? "Zoom. Pinch below 1x for ultrawide, or tap to switch lens."\n                : "Zoom. Pinch to zoom.");'''
          if old_render not in s: raise SystemExit('render target not found')
          s = s.replace(old_render, new_render, 1)
          p.write_text(s, encoding='utf-8')

          # ----- GeoCameraActivity -----
          p = Path('app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java')
          s = p.read_text(encoding='utf-8')

          s = s.replace('''public class GeoCameraActivity extends AppCompatActivity {''', '''public class GeoCameraActivity extends AppCompatActivity\n        implements CameraGestureController.LensSwitchHandler {''', 1)

          s = s.replace('''    private Preview previewUseCase;\n    private volatile boolean isCapturing = false;''', '''    private Preview previewUseCase;\n    private volatile boolean isCapturing = false;\n    private ProcessCameraProvider cameraProvider;\n    private CameraSelector wideCameraSelector;\n    private float wideEffectiveRatio = 1.0f;\n    private boolean usingWideLens = false;''', 1)

          start = s.index('    private void startCamera() {')
          end = s.index('    private final GnssStatus.Callback gnssCallback', start)
          replacement = r'''    @androidx.camera.camera2.interop.ExperimentalCamera2Interop\n    private void startCamera() {\n        ListenableFuture<ProcessCameraProvider> future = ProcessCameraProvider.getInstance(this);\n        future.addListener(() -> {\n            try {\n                cameraProvider = future.get();\n                detectUltrawideCamera(cameraProvider);\n                bindSelectedCamera(false);\n            } catch (Exception e) {\n                e.printStackTrace();\n                finishCaptureError("Camera failed to start.");\n            }\n        }, mainExecutor);\n    }\n\n    @androidx.camera.camera2.interop.ExperimentalCamera2Interop\n    private void detectUltrawideCamera(ProcessCameraProvider provider) {\n        wideCameraSelector = null;\n        wideEffectiveRatio = 1.0f;\n        try {\n            java.util.List<androidx.camera.core.CameraInfo> backInfos =\n                    CameraSelector.DEFAULT_BACK_CAMERA.filter(provider.getAvailableCameraInfos());\n            if (backInfos.isEmpty()) return;\n\n            androidx.camera.core.CameraInfo mainInfo = backInfos.get(0);\n            float mainFocal = shortestFocalLength(mainInfo);\n            if (mainFocal <= 0f) return;\n\n            androidx.camera.core.CameraInfo widestInfo = null;\n            float widestFocal = mainFocal;\n            for (androidx.camera.core.CameraInfo info : provider.getAvailableCameraInfos()) {\n                if (info.getLensFacing() == null ||\n                        info.getLensFacing() != CameraSelector.LENS_FACING_BACK) continue;\n                float focal = shortestFocalLength(info);\n                if (focal > 0f && focal < widestFocal * 0.90f) {\n                    widestFocal = focal;\n                    widestInfo = info;\n                }\n            }\n            if (widestInfo == null) return;\n\n            final String wideId = androidx.camera.camera2.interop.Camera2CameraInfo\n                    .from(widestInfo).getCameraId();\n            wideCameraSelector = new CameraSelector.Builder()\n                    .addCameraFilter(cameraInfos -> {\n                        java.util.List<androidx.camera.core.CameraInfo> result = new java.util.ArrayList<>();\n                        for (androidx.camera.core.CameraInfo info : cameraInfos) {\n                            try {\n                                String id = androidx.camera.camera2.interop.Camera2CameraInfo\n                                        .from(info).getCameraId();\n                                if (wideId.equals(id)) result.add(info);\n                            } catch (Exception ignored) {}\n                        }\n                        return result;\n                    }).build();\n            wideEffectiveRatio = Math.max(0.3f, Math.min(0.95f, widestFocal / mainFocal));\n        } catch (Exception ignored) {\n            wideCameraSelector = null;\n            wideEffectiveRatio = 1.0f;\n        }\n    }\n\n    @androidx.camera.camera2.interop.ExperimentalCamera2Interop\n    private float shortestFocalLength(androidx.camera.core.CameraInfo info) {\n        try {\n            float[] focalLengths = androidx.camera.camera2.interop.Camera2CameraInfo.from(info)\n                    .getCameraCharacteristic(android.hardware.camera2.CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS);\n            if (focalLengths == null || focalLengths.length == 0) return -1f;\n            float min = Float.MAX_VALUE;\n            for (float focal : focalLengths) if (focal > 0f && focal < min) min = focal;\n            return min == Float.MAX_VALUE ? -1f : min;\n        } catch (Exception ignored) {\n            return -1f;\n        }\n    }\n\n    private void bindSelectedCamera(boolean useWide) {\n        ProcessCameraProvider provider = cameraProvider;\n        if (provider == null) return;\n        if (useWide && wideCameraSelector == null) useWide = false;\n\n        try {\n            int rotation = (previewView != null && previewView.getDisplay() != null)\n                    ? previewView.getDisplay().getRotation() : Surface.ROTATION_0;\n            lastRotation = rotation;\n\n            previewUseCase = new Preview.Builder().setTargetRotation(rotation).build();\n            previewUseCase.setSurfaceProvider(previewView.getSurfaceProvider());\n            imageCapture = new ImageCapture.Builder()\n                    .setTargetRotation(rotation)\n                    .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)\n                    .setJpegQuality(92)\n                    .build();\n\n            androidx.camera.core.ViewPort viewPort = previewView.getViewPort();\n            androidx.camera.core.UseCaseGroup.Builder groupBuilder =\n                    new androidx.camera.core.UseCaseGroup.Builder()\n                            .addUseCase(previewUseCase).addUseCase(imageCapture);\n            if (viewPort != null) groupBuilder.setViewPort(viewPort);\n\n            CameraSelector selector = useWide ? wideCameraSelector : CameraSelector.DEFAULT_BACK_CAMERA;\n            provider.unbindAll();\n            androidx.camera.core.Camera boundCamera = provider.bindToLifecycle(\n                    this, selector, groupBuilder.build());\n            usingWideLens = useWide;\n            if (cameraGestureController != null) {\n                cameraGestureController.attachCamera(boundCamera,\n                        useWide ? wideEffectiveRatio : 1.0f,\n                        wideCameraSelector != null, useWide);\n            }\n        } catch (Exception e) {\n            e.printStackTrace();\n            if (useWide) {\n                wideCameraSelector = null;\n                bindSelectedCamera(false);\n            } else {\n                finishCaptureError("Camera failed to start.");\n            }\n        }\n    }\n\n    @Override\n    public void requestWideLens() {\n        if (!isCapturing && !usingWideLens && wideCameraSelector != null) {\n            runOnUiThread(() -> bindSelectedCamera(true));\n        }\n    }\n\n    @Override\n    public void requestMainLens() {\n        if (!isCapturing && usingWideLens) {\n            runOnUiThread(() -> bindSelectedCamera(false));\n        }\n    }\n\n'''.replace('\\n','\n')
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'implements CameraGestureController.LensSwitchHandler' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java
          grep -q 'detectUltrawideCamera' app/src/main/java/ph/gov/geocamera/presentation/geocamera/GeoCameraActivity.java
          grep -q 'targetEffective < NORMAL_ZOOM_RATIO' app/src/main/java/ph/gov/geocamera/presentation/geocamera/CameraGestureController.java
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/ultrawide-pinch-switch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add capability aware ultrawide pinch switching'
          git push origin HEAD:feature/gallery-photo-actions
